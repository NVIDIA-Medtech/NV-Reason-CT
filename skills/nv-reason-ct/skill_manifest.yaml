id: medagent.nv_reason_ct
version: 0.1.0
license: OpenMDW-1.1
upstream_refs:
  - kind: huggingface_repo
    name: nvidia/NV-Reason-CT
    repo_id: nvidia/NV-Reason-CT
    revision: main
    notes: Replace the moving branch with the reviewed immutable public release revision before publication.
  - kind: git_repo
    name: NVIDIA-Medtech/NV-Reason-CT inference examples
    repo_url: https://github.com/NVIDIA-Medtech/NV-Reason-CT
    revision: main
    notes: README.md, inference.py, and requirements.txt define the upstream single-turn contract. The examples/ directory provides three Git LFS CT volumes; example_1 supports the documented chest and abdomen end-to-end checks. Record the inspected Git commit and LFS content hashes in local evidence while the repository is private.
license_restrictions:
  wrapper: OpenMDW-1.1
  upstream_model_and_code: OpenMDW-1.1
  redistribution: retain_license_and_applicable_notices
intended_use:
  summary: >
    Engineering-time wrapper around nvidia/NV-Reason-CT inference for a
    user-provided 3D NIfTI CT volume and text prompt. Invokes the documented
    Hugging Face Transformers custom-code path and emits structured JSON with
    input metadata, crop selection, response text, runtime identity, and
    limitations.
  scope: development
  not_for:
    - clinical deployment
    - clinical interpretation
    - autonomous diagnosis
    - treatment decisions
    - triage
    - patient-facing report generation
    - regulatory submission

inputs:
  - name: ct_request_or_fixture
    type: file_path
    formats:
      - json
    description: >
      JSON request used by the eval harness. It may point to a caller-owned or
      separately downloaded upstream example CT volume, or request deterministic
      generated NIfTI wiring data and a mock response. The generated fixture is
      not a model-quality demo.
  - name: ct_volume
    type: file_path
    formats:
      - nifti
    optional: true
    description: >
      Direct wrapper use accepts one 3D .nii or .nii.gz CT volume in
      Hounsfield units instead of a JSON request.

outputs:
  - name: result_json
    type: json
    schema: validators/output_schema.json
    description: >
      JSON on stdout. On token-limit truncation, the wrapper also retains a
      unique partial_result_*.json under --out-dir and exits 3; partial output
      must not be treated as completed generation.

runtime:
  language: python
  python: ">=3.11"
  entrypoint: scripts/run_nv_reason_ct.py
  args:
    - "${python}"
    - "${script}"
    - "${fixture}"
    - "--out-dir"
    - "${out}/artifacts"
  dependencies:
    transformers: "==5.6.2"
    torch: ">=2.9.0"
    monai: ">=1.5.1"
    nibabel: ">=5.3.3"
    dynamic-network-architectures: "==0.4.3"
    scipy: "*"
    numpy: "*"
    Pillow: "*"
    timm: "*"
    einops: "*"
    safetensors: "*"
    huggingface_hub: ">=1.5,<2"
    packaging: ">=20.9"
  env_optional:
    - MOCK_NV_REASON_CT
    - NV_REASON_CT_MODEL
    - NV_REASON_CT_REVISION
    - HF_HOME
    - HF_HUB_CACHE
    - HF_MODULES_CACHE
    - XDG_CACHE_HOME
    - TORCH_HOME
    - HF_TOKEN
    - TRANSFORMERS_OFFLINE
    - HF_HUB_OFFLINE
    - CUDA_VISIBLE_DEVICES
  external_assets:
    - kind: huggingface_repo
      repo_id: nvidia/NV-Reason-CT
      install_command: |
        python -m pip install "huggingface_hub>=1.5,<2" &&
        nv_reason_ct_prereqs="$(mktemp -d)" &&
        hf download nvidia/NV-Reason-CT requirements.txt \
          --revision "${NV_REASON_CT_REVISION:-main}" --local-dir "$nv_reason_ct_prereqs" &&
        python -m pip install -r "$nv_reason_ct_prereqs/requirements.txt" "torch>=2.9.0"
      contains:
        - README.md
        - LICENSE
        - config.json
        - model.py
        - processor.py
        - processor_config.json
        - preprocessor_config.json
        - video_preprocessor_config.json
        - image_processor_3d/preprocessor_config.json
        - generation_config.json
        - tokenizer_config.json
        - tokenizer.json
        - chat_template.jinja
        - model.safetensors
  side_effects:
    pip_packages:
      - transformers==5.6.2
      - torch>=2.9.0
      - monai>=1.5.1
      - nibabel>=5.3.3
      - dynamic-network-architectures==0.4.3
      - scipy
      - numpy
      - Pillow
      - timm
      - einops
      - safetensors
      - "huggingface_hub>=1.5,<2"
      - packaging>=20.9
    local_writes:
      - {path: "<caller-provided --out-dir>", approx_mb_max: 5}
    home_writes:
      - {path: ~/.cache/huggingface/, approx_mb_max: 16000}
    network_endpoints:
      - https://huggingface.co
    requires_docker: false
    requires_gpu: cuda
    gpu_fallback: mock_only
    environment:
      clean_environment_required: false
      clean_environment_recommended: true
      modifies_active_python_environment: false
      user_environment_modification_ok: false
      recommended_isolation: fresh venv or container for live inference and evidence runs
      notes: >
        The upstream requirements pin Transformers and
        dynamic-network-architectures and require torch>=2.9.0. The wrapper
        never installs packages. Install prerequisites only in a caller-selected
        isolated environment; capture --check-setup output for evidence.
    env_required: []
    env_optional:
      - MOCK_NV_REASON_CT
      - NV_REASON_CT_MODEL
      - NV_REASON_CT_REVISION
      - HF_HOME
      - HF_HUB_CACHE
      - HF_MODULES_CACHE
      - XDG_CACHE_HOME
      - TORCH_HOME
      - HF_TOKEN
      - TRANSFORMERS_OFFLINE
      - HF_HUB_OFFLINE
      - CUDA_VISIBLE_DEVICES

limitations:
  - >
    This is a thin wrapper. NIfTI preprocessing, anatomy-aware cropping, model
    inference, and decoding are delegated to the nvidia/NV-Reason-CT custom
    Transformers code loaded with trust_remote_code=True.
  - >
    Output is not a diagnosis, clinical report, treatment recommendation, or
    triage decision. It is engineering evidence and requires qualified review
    before any medical use.
  - >
    The wrapper validates readable 3D NIfTI structure and finite affine and
    spacing metadata, but does not verify de-identification, Hounsfield-unit
    calibration, crop quality, anatomy coverage, or clinical correctness.
  - >
    The committed fixture generates deterministic synthetic NIfTI wiring data
    and a mock response under the run directory. Mock mode does not exercise
    model preprocessing or inference and is not a model-quality demo.
  - >
    Real-data integration and live end-to-end checks use the separately
    downloaded upstream Git LFS examples, not bundled CT images. GitHub access
    is required while the source is private. example_1 is used for both chest
    and abdomen; no clinical ground truth or quality score is inferred from
    agreement with the upstream CLI.
  - >
    Upstream pins transformers==5.6.2 and
    dynamic-network-architectures==0.4.3 and requires torch>=2.9.0 but does not
    pin an exact PyTorch build or every numerical dependency. Use an isolated
    environment and retain the setup report for live evidence.
  - >
    The manifest currently follows the moving model revision main. Replace it
    with a reviewed immutable public release revision before publication.
  - >
    Each wrapper invocation is a single-turn inference request. It does not
    implement upstream's model-reuse or multi-turn history examples. Upstream
    training JSONL records are not inference fixtures and do not include CT volumes.

validation:
  expected_runtime_seconds:
    min: 0.0
    max: 3600.0
    inference_path: runtime.inference_seconds
  env_pin:
    nibabel: ">=5.3.3"
  sanity_checks:
    - {path: skill, eq: nv_reason_ct}
    - {path: input.volume.format, eq: nifti}
    - {path: input.volume.ndim, eq: 3}
    - {path: input.volume.shape, length_eq: 3}
    - {path: input.volume.spacing_mm, length_eq: 3}
    - {path: input.volume.sha256, matches: "^[0-9a-f]{64}$"}
    - {path: input.anatomy_region, matches: "^(chest|abdomen|none)$"}
    - {path: output.response_text, length_gte: 1}
    - {path: runtime.model, eq: nvidia/NV-Reason-CT}
    - {path: runtime.mode, matches: "^(mock|hf_transformers)$"}
    - {path: runtime.attention_implementation, eq: sdpa}
    - {path: runtime.trust_remote_code, eq: true}
    - {path: runtime.deterministic_generation, eq: true}
    - {path: runtime.truncated_by_max_new_tokens, eq: false}
  expected_cost:
    wall_seconds: {max: 3600}
    cpu_seconds: {max: 7200}
    rss_mb_peak: {max: 64000}
    gpu_seconds: {max: 3600}
    gpu_memory_mb_peak: {max: 96000}
  reproducibility:
    mode: repeat
    fixture: fixtures/synthetic_ct_input.json
    runs: 2
    env:
      MOCK_NV_REASON_CT: "1"
